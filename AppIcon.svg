<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8DFF"/>
      <stop offset="1" stop-color="#3A2FC9"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEFF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14106B" flood-opacity="0.45"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#outer)"/>
  <!-- fenêtre arrière -->
  <g>
    <rect x="218" y="246" width="430" height="320" rx="38" fill="url(#back)"/>
    <circle cx="266" cy="292" r="15" fill="#fff" fill-opacity="0.75"/>
    <circle cx="312" cy="292" r="15" fill="#fff" fill-opacity="0.75"/>
    <circle cx="358" cy="292" r="15" fill="#fff" fill-opacity="0.75"/>
  </g>
  <!-- fenêtre avant -->
  <g filter="url(#sh)">
    <rect x="356" y="400" width="450" height="360" rx="40" fill="url(#front)"/>
    <path d="M356 440a40 40 0 0 1 40-40h370a40 40 0 0 1 40 40v48H356z" fill="#D5DDFB"/>
    <circle cx="408" cy="444" r="16" fill="#FF5F57"/>
    <circle cx="458" cy="444" r="16" fill="#FEBC2E"/>
    <circle cx="508" cy="444" r="16" fill="#28C840"/>
    <!-- épingle : la fenêtre reste à sa place -->
    <g transform="translate(581 630)">
      <circle r="84" fill="#3F3AD6"/>
      <path d="M-34 4l24 24 46-52" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
